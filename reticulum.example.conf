# Linux Reticulum configuration. Copy to /data/reticulum/config before startup,
# or merge the discovery settings and bootstrap interfaces into an existing file.
[reticulum]
  enable_transport = False
  share_instance = Yes
  instance_name = qapp-backend-call
  discover_interfaces = Yes
  autoconnect_discovered_interfaces = 5

[logging]
  loglevel = 4

[interfaces]
  [[Qortal Backbone]]
    type = BackboneInterface
    enabled = Yes
    remote = reticulum.qortal.link
    target_port = 4444
    network_name = qortal-hub

  [[Public Discovery Bootstrap Montreal]]
    type = BackboneInterface
    enabled = Yes
    remote = 67.212.78.132
    target_port = 4242

  [[Public Discovery Bootstrap San Jose]]
    type = BackboneInterface
    enabled = Yes
    remote = sjc.us.thunderhost.net
    target_port = 4242
