[project]
name = "qapp-backend-call"
version = "0.1.0"
description = "Authenticated Reticulum and private-transport backend for Q-Apps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43,<47",
  "rns==1.5.2",
]

[project.scripts]
qapp-backend-call = "qapp_backend.main:main"

[dependency-groups]
dev = [
  "aioquic>=1.3,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qapp_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
